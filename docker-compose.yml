services:
  bankguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankguard-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/bankguard.db
      - Jwt__Key=BankGuardSuperSecretKeyForJwtSigning2026!@#
      - Jwt__Issuer=BankGuardAPI
      - Jwt__Audience=BankGuardClients
    volumes:
      - bankguard_data:/app/data
    restart: unless-stopped

volumes:
  bankguard_data:
  